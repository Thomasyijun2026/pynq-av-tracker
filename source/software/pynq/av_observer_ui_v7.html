<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PYNQ · 定位演示</title><style>
:root{color-scheme:dark;--bg:#101419;--panel:#1a2027;--line:#303a44;--text:#eef3f5;--muted:#9caeb9;--accent:#8edcc2;--warn:#f3c784}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.6 "Segoe UI","Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#25313a;color:var(--text);border-radius:10px;padding:10px 17px}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}main{max-width:1280px;margin:auto;padding:32px 40px}header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:34px}.eyebrow{letter-spacing:.16em;font-size:12px;color:var(--accent)}h1{font-size:30px;line-height:1.25;margin:9px 0 5px;font-weight:600}p{margin:0}.muted{color:var(--muted)}.badge{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:100px;padding:7px 13px;font-size:13px}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.warn{color:var(--warn)}.toolbar{display:flex;gap:18px;align-items:center;margin:20px 0}.primary{background:var(--accent);color:#0d2922;border-color:var(--accent);font-weight:600}.layout{display:grid;grid-template-columns:1fr 350px;gap:24px}.panel{border:1px solid var(--line);border-radius:17px;background:var(--panel);padding:24px}.panelhead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}h2{font-size:18px;font-weight:600;margin:0}.count{font-size:13px;color:var(--muted)}#cards{display:grid;gap:12px}.source{display:flex;align-items:center;justify-content:space-between;text-align:left;width:100%;padding:20px;background:#202a32}.source b{font-size:18px}.source small{display:block;color:var(--muted);margin-top:5px}.source .angle{font-size:27px;font-variant-numeric:tabular-nums;color:var(--accent)}.empty{padding:48px 18px;text-align:center;border:1px dashed var(--line);border-radius:12px}.empty p+p{margin-top:12px}.ring{position:relative;width:260px;height:260px;border:1px solid #41525e;border-radius:50%;margin:26px auto 20px;background:radial-gradient(circle,transparent 32%,#303a4466 32.3%,transparent 33%,transparent 65%,#303a4466 65.3%,transparent 66%)}.ring:before,.ring:after{content:"";position:absolute;background:#303a44}.ring:before{height:1px;top:50%;width:100%}.ring:after{width:1px;left:50%;height:100%}.label{position:absolute;color:var(--muted);font-size:12px}.north{top:-24px;left:47%}.south{bottom:-24px;left:44%}.east{right:-25px;top:46%}.west{left:-34px;top:46%}.marker{position:absolute;z-index:2;transform:translate(-50%,-50%);width:33px;height:33px;display:grid;place-items:center;background:var(--accent);color:#0d2922;border-radius:50%;font-weight:700;border:4px solid #19372f}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:8px;height:8px;background:#eee;border-radius:50%}#notice{min-height:30px;margin-top:15px}#jobs{margin-top:24px}.job{display:grid;grid-template-columns:1fr 150px 90px;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:13px}.job .duration{text-align:right;font-variant-numeric:tabular-nums}footer{margin-top:25px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}.imagebox{background:#07090c;border-radius:13px;overflow:hidden;min-height:240px;display:grid;place-items:center;margin:20px 0}.imagebox img{width:100%;max-height:65vh;object-fit:contain;transform:rotate(180deg)}.viewhead{display:flex;align-items:center;justify-content:space-between}.caption{display:flex;justify-content:space-between;gap:20px;font-size:13px}#progress{height:3px;background:var(--accent);width:100%;animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.3}}@media(max-width:900px){main{padding:24px 20px}.layout{grid-template-columns:1fr}.ring{margin-top:38px}header{align-items:flex-start}h1{font-size:25px}.toolbar{flex-wrap:wrap}.job{grid-template-columns:1fr 120px 70px}}

/* Fixed optical target; the loader is outside the decoded square. */
.init-screen{text-align:center;min-height:65vh;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:14px 0 32px}
.sound-mark{width:min(48vh,420px);height:min(48vh,420px);min-width:240px;min-height:240px;background:white;border-radius:16px;padding:14px;box-shadow:0 18px 64px #0003}
.sound-mark svg{display:block;width:100%;height:100%}.init-screen h2{font-size:28px;letter-spacing:.1em;margin:25px 0 8px;font-weight:500}
.init-screen p{color:var(--muted);font-size:14px}.init-loader{overflow:hidden;margin:23px auto 0;width:220px;height:4px;background:#2b3b3f;border-radius:9px}
.init-loader span{display:block;width:80px;height:4px;background:var(--accent);border-radius:9px;animation:travel 1.5s ease-in-out infinite}
@keyframes travel{0%{transform:translateX(-85px)}100%{transform:translateX(230px)}}
body.init-mode #jobs,body.init-mode #overview,body.init-mode #view,body.init-mode footer,body.init-mode #progress{display:none!important}
body.init-mode header{margin-bottom:14px}body.init-mode .toolbar{margin:5px 0}body.init-mode #notice{font-size:13px}
@media(max-height:760px){.init-screen{padding-top:4px}.sound-mark{min-width:190px;min-height:190px;width:38vh;height:38vh}.init-screen h2{margin-top:16px}}
</style><main><header><div><div class="eyebrow">PYNQ / AUDIOVISUAL LOCALIZATION</div><h1>声源观察台</h1><p class="muted">听到方向，转向目标。</p></div><div class="badge"><span class="dot" id="dot"></span><span id="connection">正在连接板子</span></div></header>
<div class="toolbar"><button id="init" class="primary">重新初始化</button><span id="calibration" class="muted">等待板端状态</span><span class="muted">板上 BTN0 同样可启动</span></div><div id="progress" hidden></div><p id="notice" role="status" aria-live="polite"></p>
<section class="init-screen" id="initScreen"><div class="sound-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 13 13" shape-rendering="crispEdges" role="img" aria-label="声音定位识别图案"><rect width="13" height="13" fill="#fff"/><g fill="#10231f"><rect x="1" y="1" width="1" height="1"/><rect x="2" y="1" width="1" height="1"/><rect x="3" y="1" width="1" height="1"/><rect x="4" y="1" width="1" height="1"/><rect x="5" y="1" width="1" height="1"/><rect x="6" y="1" width="1" height="1"/><rect x="7" y="1" width="1" height="1"/><rect x="8" y="1" width="1" height="1"/><rect x="9" y="1" width="1" height="1"/><rect x="10" y="1" width="1" height="1"/><rect x="11" y="1" width="1" height="1"/><rect x="1" y="2" width="1" height="1"/><rect x="6" y="2" width="1" height="1"/><rect x="11" y="2" width="1" height="1"/><rect x="1" y="3" width="1" height="1"/><rect x="6" y="3" width="1" height="1"/><rect x="11" y="3" width="1" height="1"/><rect x="1" y="4" width="1" height="1"/><rect x="6" y="4" width="1" height="1"/><rect x="11" y="4" width="1" height="1"/><rect x="1" y="5" width="1" height="1"/><rect x="4" y="5" width="1" height="1"/><rect x="6" y="5" width="1" height="1"/><rect x="11" y="5" width="1" height="1"/><rect x="1" y="6" width="1" height="1"/><rect x="4" y="6" width="1" height="1"/><rect x="6" y="6" width="1" height="1"/><rect x="8" y="6" width="1" height="1"/><rect x="11" y="6" width="1" height="1"/><rect x="1" y="7" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/><rect x="6" y="7" width="1" height="1"/><rect x="8" y="7" width="1" height="1"/><rect x="11" y="7" width="1" height="1"/><rect x="1" y="8" width="1" height="1"/><rect x="2" y="8" width="1" height="1"/><rect x="4" y="8" width="1" height="1"/><rect x="6" y="8" width="1" height="1"/><rect x="8" y="8" width="1" height="1"/><rect x="11" y="8" width="1" height="1"/><rect x="1" y="9" width="1" height="1"/><rect x="2" y="9" width="1" height="1"/><rect x="4" y="9" width="1" height="1"/><rect x="6" y="9" width="1" height="1"/><rect x="8" y="9" width="1" height="1"/><rect x="10" y="9" width="1" height="1"/><rect x="11" y="9" width="1" height="1"/><rect x="1" y="10" width="1" height="1"/><rect x="2" y="10" width="1" height="1"/><rect x="4" y="10" width="1" height="1"/><rect x="6" y="10" width="1" height="1"/><rect x="8" y="10" width="1" height="1"/><rect x="10" y="10" width="1" height="1"/><rect x="11" y="10" width="1" height="1"/><rect x="1" y="11" width="1" height="1"/><rect x="2" y="11" width="1" height="1"/><rect x="3" y="11" width="1" height="1"/><rect x="4" y="11" width="1" height="1"/><rect x="5" y="11" width="1" height="1"/><rect x="6" y="11" width="1" height="1"/><rect x="7" y="11" width="1" height="1"/><rect x="8" y="11" width="1" height="1"/><rect x="9" y="11" width="1" height="1"/><rect x="10" y="11" width="1" height="1"/><rect x="11" y="11" width="1" height="1"/></g></svg></div><h2 id="initTitle">准备初始化</h2><p id="initDetail">正在连接板端程序</p><div class="init-loader" id="initLoader" role="progressbar" aria-label="程序初始化进行中" hidden><span></span></div></section>
<aside id="preview" hidden style="position:fixed;right:18px;bottom:18px;width:240px;z-index:4;background:#18272b;border-radius:10px;padding:10px"><img id="previewImage" alt="板端相机最近采集快照" style="width:100%;transform:rotate(180deg)"><p id="previewCaption" style="font-size:12px;margin:6px 0 0"></p></aside>
<section id="overview" class="layout"><div class="panel"><div class="panelhead"><h2>检测到的声源</h2><span class="count" id="count">0 / 3</span></div><div id="cards"></div></div><aside class="panel"><div class="panelhead"><h2>阵列方位</h2><span class="count">固定坐标系</span></div><div class="ring"><span class="label north">0°</span><span class="label east">90°</span><span class="label south">±180°</span><span class="label west">−90°</span><span class="center"></span><div id="markers"></div></div><p class="muted" style="text-align:center;margin-top:35px;font-size:12px">方向由板内麦克风定位给出</p></aside></section>
<section id="view" class="panel" hidden><div class="viewhead"><button id="back">← 返回声源列表</button><h2 id="viewtitle">目标画面</h2></div><div class="imagebox"><img id="frame" alt="板端转向后保存的目标确认画面"></div><div class="caption"><span id="viewcaption"></span><span class="muted">本次到位后的确认图像</span></div></section>
<section class="panel" id="jobs"><div class="panelhead"><h2>最近任务</h2><span class="count">板端实测耗时 · 含清理</span></div><div id="history"></div></section><footer>定位、识别、转动与结果选择均由 PYNQ 执行。电脑用于显示与触发。初始化后自动监听，点选声源方向查看转向后的新画面。</footer></main>
<script>
'use strict';let state=null,request=null,viewSource=null,busy=false;const $=id=>document.getElementById(id);
const labels={WAITING_FOR_WORKER_COMPLETION:'等待当前采集自然结束',RELATIVE_TARGET_CONFIRMED:'相对方向已确认',TARGET_CONFIRMED:'目标已确认',NOT_VERIFIED:'本次未完成确认',DEADLINE_EXCEEDED:'本次超时',RUNNING:'处理中',CANCELLING:'正在结束',CANCELLED:'已取消',WAITING_FOR_AUDIO_CLEANUP:'正在结束后台采音',WAITING_FOR_WORKER_RETURN:'等待资源交接',DISCOVERY_RECORDED:'方向已更新',DISCOVERY_REJECTED:'本段声音未采用',FAILED:'执行失败',BLOCKED:'等待处理',CLEANUP_UNCONFIRMED:'资源状态待核对',DEADLINE_CLEANUP:'正在释放资源'};
const name=s=>s.label==='computer'?'电脑声源':s.label;const angle=v=>Number.isFinite(v)?v.toFixed(1)+'°':'—';
function element(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e;}
function render(){if(!state)return;renderPhase(true);const inputHold=state.input_hold;renderPreview();$('connection').textContent=state.runtime_ready===false?'板端已连接 · 定位准备中':(inputHold?'相机画面不可用':(state.active?'板端运行中':'板端已连接'));$('dot').style.background='var(--accent)';$('calibration').textContent=inputHold?'等待相机恢复可用画面':(state.calibration==='RELATIVE_SINGLE_SOURCE'?'相对方位已对齐':'等待本次坐标初始化');$('init').disabled=!state.can_request||busy||!!request;$('progress').hidden=!state.active;$('count').textContent=state.sources.length+' / 3';$('cards').replaceChildren();$('markers').replaceChildren();
if(!state.sources.length){const e=element('div',undefined,'empty');e.append(element('p','正在等待可用的声源方向'),element('p','坐标初始化通过后，板子会持续更新最近听到的方向。','muted'));$('cards').append(e);}
state.sources.forEach((s,i)=>{const b=element('button',undefined,'source'),left=element('span'),right=element('span',angle(s.bearing_deg),'angle');left.append(element('b',String(i+1).padStart(2,'0')+'  '+name(s)),element('small',s.direction_status==='CONFIRMED'?'转向此方向 →':'等待第二次声音确认'));b.append(left,right);b.disabled=!s.selectable||busy||!!request;b.onclick=()=>command('select',s.source_id);$('cards').append(b);const m=element('span',i+1,'marker'),r=s.bearing_deg*Math.PI/180;m.style.left=50+38*Math.sin(r)+'%';m.style.top=50-38*Math.cos(r)+'%';m.title=name(s)+' '+angle(s.bearing_deg);$('markers').append(m);});
$('history').replaceChildren();state.jobs.slice(-4).reverse().forEach(j=>{const row=element('div',undefined,'job');row.append(element('span',j.action==='discover'?'监听声源方向':(j.action==='select'?'查看目标':'初始化坐标与目标')),element('span',labels[j.status]||j.status,j.navigation_ready?'':'muted'),element('span',Number.isFinite(j.total_seconds)?j.total_seconds.toFixed(2)+' s':'—','duration'));$('history').append(row);});
if(state.discovery_hold&&!inputHold){$('notice').textContent='板端正在等待下一段可用声音；当前拒绝原因保留在任务记录中。';}
if(inputHold){$('notice').textContent='相机当前只有暗图，初始化尚未执行。请检查镜头遮挡或相机连接。';}
if(request){const j=state.jobs.find(j=>j.id===request.id);if(j&&!['RUNNING','WAITING_FOR_AUDIO_CLEANUP','WAITING_FOR_WORKER_RETURN','WAITING_FOR_WORKER_COMPLETION','CANCELLING','DEADLINE_CLEANUP'].includes(j.status)&&state.active!==j.id){$('notice').textContent=(labels[j.status]||j.status)+(Number.isFinite(j.total_seconds)?' · '+j.total_seconds.toFixed(2)+' 秒':'');if(j.navigation_ready&&request.action==='select'){viewSource=request.source_id;showView();}request=null;}}
if(viewSource&&!state.sources.some(s=>s.source_id===viewSource))back();renderPhase(true);}
function renderPreview(){const p=state.preview;const show=!!p&&!state.active&&!viewSource;$('preview').hidden=!show;if(show){if($('previewImage').getAttribute('src')!==p.image_url)$('previewImage').src=p.image_url;$('previewCaption').textContent='相机快照 · '+Math.round(p.age_seconds)+'秒前（非实时视频）';}}
function showView(){const s=state.sources.find(s=>s.source_id===viewSource);if(!s||!s.image_url)return;$('overview').hidden=true;$('view').hidden=false;$('viewtitle').textContent=name(s);$('frame').src=s.image_url;$('viewcaption').textContent='本次转向的声学方位 '+angle(s.view_bearing_deg);}
function back(){viewSource=null;$('view').hidden=true;$('overview').hidden=false;$('frame').removeAttribute('src');}
async function poll(){try{const r=await fetch('/api/state',{cache:'no-store'});if(!r.ok)throw new Error('板端暂不可用');state=await r.json();render();}catch(e){$('connection').textContent='连接中断';$('dot').style.background='var(--warn)';$('notice').textContent='连接中断，正在读取状态。不会重复发送动作。';$('init').disabled=true;renderPhase(false);}setTimeout(poll,500);}
async function command(action,sid){if(busy||request||!state?.can_request)return;busy=true;const id='ui_'+Date.now()+'_'+Math.random().toString(16).slice(2,10);request={id,action,source_id:sid};const body={request_id:id};if(action==='select')body.source_id=sid;render();$('notice').textContent=action==='select'?'板子正在转向并核对目标画面…':'板子正在同步扫描声音与画面…';try{const r=await fetch('/api/'+action,{method:'POST',headers:{'Content-Type':'application/json','X-AV-Request':'1'},body:JSON.stringify(body)});const result=await r.json();if(!r.ok)throw new Error(result.error||'请求未被接受');}catch(e){$('notice').textContent='请求结果待核对：'+e.message+'。将继续读取板端状态，不重复发送。';}finally{busy=false;render();}}

function derivePhase(s,pending,connected){
 if(!connected||!s)return {show:true,running:false,title:'等待板端连接',detail:'识别图案已准备好，连接恢复后继续显示实际进度。'};
 if(s.runtime_ready===false)return {show:true,running:false,title:'板端已连接',detail:s.status_message||'定位程序正在准备，当前未开始定位。'};
 if(s.closed)return {show:true,running:false,title:'板端程序已结束',detail:'当前没有定位动作。'};
 if(s.active_action==='initialize')return {show:true,running:true,title:'程序初始化',detail:'正在识别屏幕、测量声音方向并对齐坐标。'};
 if(pending?.action==='initialize')return {show:true,running:false,title:'等待初始化确认',detail:'请求已提交，正在核对板端状态。'};
 if(s.calibration==='RELATIVE_SINGLE_SOURCE')return {show:false,running:false,title:'初始化完成',detail:''};
 const last=(s.jobs||[]).filter(j=>j.action==='initialize').slice(-1)[0];
 return {show:true,running:false,title:last?'初始化尚未通过':'准备初始化',detail:last?'本次结果已保留，等待新的有效初始化。':'电脑屏幕作为已知目标，点击重新初始化开始。'};
}
function renderPhase(connected){const p=derivePhase(state,request,connected);document.body.classList.toggle('init-mode',p.show);$('initScreen').hidden=!p.show;$('initTitle').textContent=p.title;$('initDetail').textContent=p.detail;$('initLoader').hidden=!p.running;}
window.avReceiver={derivePhase};renderPhase(false);
$('init').onclick=()=>{back();command('initialize');};$('back').onclick=back;$('frame').onerror=()=>{$('notice').textContent='确认图像暂不可用，保留当前任务状态。';};poll();
</script></html>
